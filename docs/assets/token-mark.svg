<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" role="img" aria-labelledby="title desc">
  <title id="title">TokenLab logo</title>
  <desc id="desc">A segmented token symbol beside the TokenLab wordmark.</desc>
  <style>
    .word { fill: #1e293b; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f1f5f9; }
    }
  </style>

  <g transform="translate(38 34)">
    <rect width="92" height="72" rx="22" fill="#4f46e5"/>
    <rect x="1" y="1" width="90" height="70" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <rect x="20" y="22" width="14" height="28" rx="5" fill="#ffffff" fill-opacity=".7"/>
    <rect x="39" y="16" width="14" height="40" rx="5" fill="#ffffff"/>
    <rect x="58" y="22" width="14" height="28" rx="5" fill="#ffffff" fill-opacity=".7"/>
  </g>

  <text class="word" x="154" y="87" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700">Token</text>
  <text x="319" y="87" fill="#6366f1" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700">Lab</text>
</svg>
